dataset_name: NEU-DET
description: Steel Surface Defect Detection Dataset
source: Northeastern University, China
publication: Song & Yan, Applied Surface Science, 2013
total_classes: 6
class_names:
- crazing
- inclusion
- patches
- pitted_surface
- rolled-in_scale
- scratches
class_names_cn:
- 裂纹
- 夹杂
- 斑块
- 麻点
- 氧化铁皮
- 划痕
original_image_size: 200x200
processed_image_size: 640x640
original_channels: 1
processed_channels: 3
annotation_format: YOLO (normalized x_center, y_center, width, height)
preprocessing:
  resize: 640x640
  interpolation: INTER_CUBIC
  grayscale_to_rgb: true
augmentation:
  enabled: true
  hflip_prob: 0.5
  vflip_prob: 0.3
  rotation_prob: 0.3
  rotation_angles:
  - 90
  - 180
  - 270
  brightness_range: !!python/tuple
  - -30
  - 30
  contrast_range: !!python/tuple
  - 0.8
  - 1.2
  noise_prob: 0.3
  noise_sigma: 5
